# Smart Automotive Quality Inspection Platform
#   docker compose up --build      ->  dashboard on http://localhost:8080
# Copy .env.example to .env first and set API_KEY.
services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/inspection.db}
      DETECTION_MODE: ${DETECTION_MODE:-auto}
      MODEL_WEIGHTS_PATH: ${MODEL_WEIGHTS_PATH:-/app/models/best.onnx}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.25}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.45}
      API_KEY: ${API_KEY:?set API_KEY in .env (see .env.example)}
      # The PLC target is the SIMULATOR container below, never real hardware.
      PLC_HOST: plc-simulator
      PLC_PORT: "5020"
      PLC_ALLOW_NON_LOCAL_HOST: "true"
      PLC_AUTOSTART_SIMULATOR: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - inspection_data:/app/data
      - ./models:/app/models:ro
    ports:
      - "127.0.0.1:8000:8000"   # API only on localhost; the public entry point is the frontend proxy
    depends_on:
      - plc-simulator
    restart: unless-stopped

  plc-simulator:
    build: ./backend
    command: ["python", "-m", "app.plc.simulator", "--host", "0.0.0.0", "--port", "5020", "--allow-non-local"]
    # No published ports: only reachable on the compose network. It is a SIMULATOR, not a PLC.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5020), 2).close()"]
      interval: 15s
      timeout: 4s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  inspection_data:
